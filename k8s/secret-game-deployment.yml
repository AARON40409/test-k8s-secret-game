apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-game-deployment
  labels:
    app: secret-game-api 
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 2
  selector:
    matchLabels:
      app: secret-game-api
  template:
    metadata:
      labels:
        app: secret-game-api
    spec:
      containers:
        - name: secret-game-api
          image: lebon4031/secret_game_api:latest
          imagePullPolicy: Always
          ports:
          - containerPort: 5880 
          envFrom:
            - secretRef:
                name: secret-game-secret
          # Health checks critiques
          readinessProbe:
            httpGet:
              path: /health
              port: 5880
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: 5880
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # Probe de démarrage pour les apps lentes
          startupProbe:
            httpGet:
              path: /health
              port: 5880
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12  # 12 * 5s = 60s pour démarrer
      restartPolicy: Always



