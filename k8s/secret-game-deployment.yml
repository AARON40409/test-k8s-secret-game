apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-game-deployment
  labels:
    app: secret-game-api 
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 2
  selector:
    matchLabels:
      app: secret-game-api
  template:
    metadata:
      labels:
        app: secret-game-api
    spec:
      containers:
        - name: secret-game-api
          image: lebon4031/secret_game_api:latest
          imagePullPolicy: Always
          ports:
          - containerPort: 5880 
          volumeMounts:
          - mountPath: /usr/share/nginx/html
            name: game-secret-volume
          envFrom:
            - secretRef:
                name: secret-game-secret
      volumes:   # ✅ Placé ici, au même niveau que containers
        - name: game-secret-volume
          hostPath: 
            path: /tmp/sg-mount
            type: DirectoryOrCreate
      restartPolicy: Always
